name: Build & Release (Nightly & Stable)

'on':
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Typ wydania: "nightly" lub "stable"'
        required: true
        default: 'nightly'
        type: choice
        options:
          - nightly
          - stable
      version:
        description: 'Numer wersji dla wydania stable (np. 1.0.0 - ignorowane przy nightly)'
        required: false
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14   # Apple Silicon (M1/M2/M3) runner na GitHubie

    steps:
      - name: Pobranie kodu (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ustalenie metadanych wydania
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%s)

          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAG_NAME="${GITHUB_REF_NAME}"
            RELEASE_NAME="CherryPicker ${TAG_NAME}"
            IS_PRERELEASE="false"
            DMG_NAME="CherryPicker-${VERSION}-arm64.dmg"
            echo "Oficjalne stabilne wydanie CherryPicker ${TAG_NAME}." > release_body.md
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.release_type }}" == "stable" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG_NAME="v${VERSION}"
            RELEASE_NAME="CherryPicker ${TAG_NAME}"
            IS_PRERELEASE="false"
            DMG_NAME="CherryPicker-${VERSION}-arm64.dmg"
            echo "Oficjalne wydanie CherryPicker ${TAG_NAME}." > release_body.md
          else
            VERSION="nightly-${SHORT_SHA}"
            TAG_NAME="nightly"
            RELEASE_NAME="CherryPicker (Nightly Build - ${SHORT_SHA})"
            IS_PRERELEASE="true"
            DMG_NAME="CherryPicker-nightly-arm64.dmg"

            sed -e "s/__SHORT_SHA__/${SHORT_SHA}/g" \
                -e "s/__COMMIT_MSG__/${COMMIT_MSG//\//\\/}/g" \
                -e "s/__DMG_NAME__/${DMG_NAME}/g" \
                scripts/nightly_body_template.md > release_body.md
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_name=${RELEASE_NAME}" >> $GITHUB_OUTPUT
          echo "is_prerelease=${IS_PRERELEASE}" >> $GITHUB_OUTPUT
          echo "dmg_name=${DMG_NAME}" >> $GITHUB_OUTPUT

      - name: Zbudowanie paczki .app i instalatora DMG
        run: |
          chmod +x scripts/build_dmg.sh
          ./scripts/build_dmg.sh "${{ steps.meta.outputs.version }}" "arm64" "${{ steps.meta.outputs.dmg_name }}"

      - name: Aktualizacja taga Nightly w Git (jeśli Nightly)
        if: steps.meta.outputs.is_prerelease == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f nightly
          git push -f origin nightly || true

      - name: Publikacja lub aktualizacja GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_name }}
          body_path: release_body.md
          prerelease: ${{ steps.meta.outputs.is_prerelease == 'true' }}
          draft: false
          files: ${{ steps.meta.outputs.dmg_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
